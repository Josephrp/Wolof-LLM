[project]
name = "galsenai-lfm25-wolof"
version = "0.1.0"
description = "Wolof adaptation of LiquidAI LFM2.5 (hero: 1.2B-Base)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml",
    "pandas",
    "pyarrow",
    "numpy",
    "tqdm",
    "huggingface_hub",
    "datasets",
    "jinja2",
    "trackio",
]

[dependency-groups]
train = [
    "torch",
    "transformers>=4.57",
    "accelerate",
    "peft",
    "trl",
    "bitsandbytes",
    "safetensors",
    "sentencepiece",
    "protobuf",
    "matplotlib",
    "trackio",
    # LFM2 short-conv CUDA kernel; without it transformers falls back to slow PyTorch.
    "causal-conv1d; sys_platform == 'linux'",
]
eval = [
    "sacrebleu",
    "torch",
    "transformers>=4.57",
    "accelerate",
    "trackio",
]
data = [
    "datasets",
    "pandas",
    "pyarrow",
]
dev = [
    "ruff",
    "pytest",
    "ipython",
]
notebook = [
    "jupyter",
    "ipywidgets",
    "matplotlib",
]

[project.optional-dependencies]
# flash-attn: Linux+CUDA wheels only; install with `uv sync --extra flash` on train hosts.
# flash = ["flash-attn"]
# unsloth: notebook convenience only — not the default training path (stub for later).
# unsloth = ["unsloth"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# PyTorch CUDA index for Linux train hosts. The marker keeps Windows development
# on PyPI while preventing uv from selecting CUDA 13 wheels on CUDA 12.8 hosts.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
