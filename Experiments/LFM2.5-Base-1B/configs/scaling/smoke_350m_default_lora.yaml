# Stage 3 smoke — 350M Base, default tokenizer, LoRA (no vocab ext)
# Placeholders for target_modules until 06_probe_modules.py is run.

run: smoke_350m_default_lora
stage: smoke
size: 350m
base_id: LiquidAI/LFM2.5-350M-Base
tokenizer: null          # stock Base tokenizer
model: null              # load from base_id
output_root: runs/smoke/350m_default_lora
data_root: null          # use Hub cleaned_data_for_clm via common.data
methode: lora
attention: sdpa

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  # Verified by results/full_pipeline/probes/350m.json.
  target_modules: [q_proj, k_proj, v_proj]
  modules_to_save: null

entrainement:
  max_steps: 10
  seq_len: 1024
  micro_bs: 2
  grad_acc: 4
  lr: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  logging_steps: 1
  eval_steps: 10
  save_steps: 10
  save_total_limit: 1
  gradient_checkpointing: true
  optim: adamw_torch
  seed: 42
