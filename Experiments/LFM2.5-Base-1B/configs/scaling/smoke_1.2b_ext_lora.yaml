# Stage 5 smoke — 1.2B hero, extended tokenizer, LoRA + modules_to_save

run: smoke_1.2b_ext_lora
stage: smoke
size: 1.2b
base_id: LiquidAI/LFM2.5-1.2B-Base
tokenizer: tokenizers/lfm25_wolof_ext_4000
model: models/lfm25-wolof-ext4000-init
output_root: runs/smoke/1.2b_ext_lora
data_root: null
methode: lora
attention: sdpa

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: [embed_tokens, lm_head]

entrainement:
  max_steps: 10
  seq_len: 1024
  micro_bs: 1
  grad_acc: 8
  lr: 2.0e-4
  lr_embeddings: 1.0e-3
  scheduler: cosine
  warmup_ratio: 0.03
  logging_steps: 1
  eval_steps: 10
  save_steps: 10
  save_total_limit: 1
  gradient_checkpointing: true
  optim: adamw_torch
  seed: 42
