# Stage 4 mini — 350M ext LoRA, 250–500 steps (ladder gate before 1.2B)

run: mini_350m_ext_lora
stage: mini
size: 350m
base_id: LiquidAI/LFM2.5-350M-Base
tokenizer: tokenizers/lfm25_wolof_ext_4000
model: models/lfm25-350m-wolof-ext4000-init
output_root: runs/mini/350m_ext_lora
data_root: null
methode: lora
attention: sdpa

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: [embed_tokens, lm_head]

entrainement:
  max_steps: 400
  seq_len: 2048
  micro_bs: 2
  grad_acc: 8
  lr: 2.0e-4
  lr_embeddings: 1.0e-3
  scheduler: cosine
  warmup_ratio: 0.03
  logging_steps: 25
  eval_steps: 100
  save_steps: 200
  save_total_limit: 2
  gradient_checkpointing: true
  optim: adamw_torch
  seed: 42
