# Smoke — 230M edge size, extended tokenizer, LoRA + modules_to_save

run: smoke_230m_ext_lora
stage: smoke
size: 230m
base_id: LiquidAI/LFM2.5-230M-Base
tokenizer: tokenizers/lfm25_230m_wolof_ext_4000
model: models/lfm25-230m-wolof-ext4000-init
# Build this target-size init with scripts/clm/02c_port_ext_tokenizer_to_base.py
# then scripts/clm/02b_resize_ext_to_size.py (230M stock adds <think>/</think>).
output_root: runs/smoke/230m_ext_lora
data_root: null
methode: lora
attention: sdpa

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: [embed_tokens, lm_head]

entrainement:
  max_steps: 10
  seq_len: 1024
  micro_bs: 4
  grad_acc: 2
  lr: 2.0e-4
  lr_embeddings: 1.0e-3
  scheduler: cosine
  warmup_ratio: 0.03
  logging_steps: 1
  eval_steps: 10
  save_steps: 10
  save_total_limit: 1
  gradient_checkpointing: true
  optim: adamw_torch
  seed: 42
