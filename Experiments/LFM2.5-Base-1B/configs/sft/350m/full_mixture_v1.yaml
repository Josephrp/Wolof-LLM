run: lfm_350m_sft_full_mixture_v1
model: models/v2_350m_ext4000_lora-merged
starts_from: merged_cpt
dataset: data/sft/prepared_mixture_v1
mixture_id: mixture_v1
task_weights: {translation: 0.30, tool_use: 0.20, instruction: 0.20, qa: 0.08, classification: 0.12, intent: 0.06, ner: 0.04}
output_dir: runs/sft/350m_full_mixture_v1
extended_tokenizer: true
tokenizer_family: 65k-ext
eos_token_id: 7
assistant_only_loss: true
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  modules_to_save: [embed_tokens, lm_head]
training:
  max_steps: 8000
  seq_len: 2048
  micro_bs: 4
  grad_acc: 4
  lr: 2.0e-4
  logging_steps: 25
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  packing: false
  seed: 42
