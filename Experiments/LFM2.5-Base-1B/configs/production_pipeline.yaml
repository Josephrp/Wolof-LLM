run_id: lfm25-wolof-production-v1
stages:
  - name: trackio_space
    size: common
    tracking: false
    command: [uv, run, python, scripts/publication/44_setup_trackio_space.py, --paused-dashboard-status, paused_quota]
    hash_env: [HF_TOKEN, TRACKIO_SPACE_ID]
    outputs: [results/full_pipeline/trackio_space.json, results/full_pipeline/trackio_env.json]
    export_env_json: results/full_pipeline/trackio_env.json
    tracking_metadata_json: results/full_pipeline/trackio_space.json
    resources: {min_disk_gb: 200}

  - name: hub_write_scope
    size: common
    requires: [trackio_space]
    command: [uv, run, python, scripts/publication/41_verify_write_scope.py]
    hash_env: [HF_TOKEN]
    outputs: [results/full_pipeline/hub_write_scope.json]
    resources: {min_disk_gb: 200}

  - name: environment
    size: common
    requires: [hub_write_scope]
    command: [uv, run, python, scripts/env/00_verify_env.py]
    outputs: []
    resources: {min_disk_gb: 200, require_gpu: true, min_gpu_free_mib: 30000}

  - name: full_sft_mixture
    size: common
    requires: [environment]
    command: [uv, run, python, scripts/data/21_build_sft_mixture.py, --config, configs/sft/mixture_v1.yaml]
    hash_env: [HF_TOKEN]
    outputs: [data/sft/mixture_v1/train.parquet, data/sft/mixture_v1/val.parquet, data/sft/mixture_v1/mixture_meta.json]
    resources: {min_disk_gb: 200}

