# Durable gated family evaluation for LFM2.5 Wolof HF + GGUF artifacts.
schema_version: 1
evaluation_root: /mnt/volume_w2l8nkp/Wolof-LLM-main/Evaluation
lfm_root: /mnt/volume_w2l8nkp/Wolof-LLM-main/Experiments/LFM2.5-Base-1B
llamacpp_root: /mnt/volume_w2l8nkp/tools/llama.cpp
namespace: Tonic
prefer_local_artifacts: true

clm_stock:
  - config: configs/clm/lfm_230m_base.yaml
    size: 230m
    stage: Base
  - config: configs/clm/lfm_350m_base.yaml
    size: 350m
    stage: Base
  - config: configs/clm/lfm_1.2b_base.yaml
    size: 1.2b
    stage: Base
  - config: configs/clm/lfm_2.6b_base.yaml
    size: 2.6b
    stage: Base
  - config: configs/clm/lfm_8b_base.yaml
    size: 8b-a1b
    stage: Base

clm_cpt:
  - config: configs/clm/lfm_230m_clm.yaml
    size: 230m
    stage: CPT
    local_artifact: models/v2_230m_ext_lora-merged
    hub_repo: Tonic/LFM2.5-230M-Wolof-CPT
  - config: configs/clm/lfm_350m_clm.yaml
    size: 350m
    stage: CPT
    local_artifact: models/v2_350m_ext4000_lora-merged
    hub_repo: Tonic/LFM2.5-350M-Wolof-CPT
  - config: configs/clm/lfm_1.2b_clm.yaml
    size: 1.2b
    stage: CPT
    local_artifact: models/v2_1.2b_ext4000_lora-merged
    hub_repo: Tonic/LFM2.5-1.2B-Wolof-CPT
  - config: configs/clm/lfm_2.6b_clm.yaml
    size: 2.6b
    stage: CPT
    local_artifact: models/lfm_2.6b_v2_ext4000_lora-merged
    hub_repo: Tonic/LFM2.5-2.6B-Wolof-CPT
  - config: configs/clm/lfm_8b_clm.yaml
    size: 8b-a1b
    stage: CPT
    local_artifact: models/lfm_8b_a1b_v2_moe_lora-merged
    hub_repo: Tonic/LFM2.5-8B-A1B-Wolof-CPT

clm_instruct:
  - config: configs/clm/lfm_230m_instruct.yaml
    size: 230m
    stage: Instruct
    local_artifact: models/lfm25-230m-wolof-instruct-merged
    hub_repo: Tonic/LFM2.5-230M-Wolof-Instruct
    sft_data: data/sft/prepared_mixture_v1
  - config: configs/clm/lfm_350m_instruct.yaml
    size: 350m
    stage: Instruct
    local_artifact: models/lfm25-350m-wolof-instruct-merged
    hub_repo: Tonic/LFM2.5-350M-Wolof-Instruct
    sft_data: data/sft/prepared_mixture_v1
  - config: configs/clm/lfm_1.2b_instruct.yaml
    size: 1.2b
    stage: Instruct
    local_artifact: models/lfm25-1.2b-wolof-instruct-merged
    hub_repo: Tonic/LFM2.5-1.2B-Wolof-Instruct
    sft_data: data/sft/prepared_mixture_v1
  - config: configs/clm/lfm_2.6b_instruct.yaml
    size: 2.6b
    stage: Instruct
    local_artifact: models/lfm25-2.6b-wolof-instruct-merged
    hub_repo: Tonic/LFM2.5-2.6B-Wolof-Instruct
    sft_data: data/sft/prepared_mixture_v1_128k
  - config: configs/clm/lfm_8b_instruct.yaml
    size: 8b-a1b
    stage: Instruct
    local_artifact: models/lfm25-8b-a1b-wolof-instruct-merged
    hub_repo: Tonic/LFM2.5-8B-A1B-Wolof-Instruct
    sft_data: data/sft/prepared_mixture_v1_128k

# Ortho NS+mixed CPT-v3 / Instruct-v3 (primary BPB = filtered test)
clm_cpt_v3:
  - size: 230m
    stage: CPT
    local_artifact: models/v3_230m_ortho_ns_mixed_lora-merged
    hub_repo: Tonic/LFM2.5-230M-Wolof-CPT-v3
    clm_metrics: metrics/clm/lfm_230m_cpt_v3.json
  - size: 350m
    stage: CPT
    local_artifact: models/v3_350m_ortho_ns_mixed_lora-merged
    hub_repo: Tonic/LFM2.5-350M-Wolof-CPT-v3
    clm_metrics: metrics/clm/lfm_350m_cpt_v3.json
  - size: 1.2b
    stage: CPT
    local_artifact: models/v3_1.2b_ortho_ns_mixed_lora-merged
    hub_repo: Tonic/LFM2.5-1.2B-Wolof-CPT-v3
    clm_metrics: metrics/clm/lfm_1.2b_cpt_v3.json
  - size: 2.6b
    stage: CPT
    local_artifact: models/v3_2.6b_ortho_ns_mixed_lora-merged
    hub_repo: Tonic/LFM2.5-2.6B-Wolof-CPT-v3
    clm_metrics: metrics/clm/lfm_2.6b_cpt_v3.json
  - size: 8b-a1b
    stage: CPT
    local_artifact: models/v3_8b_a1b_ortho_ns_mixed_lora-merged
    hub_repo: Tonic/LFM2.5-8B-A1B-Wolof-CPT-v3
    clm_metrics: metrics/clm/lfm_8b_cpt_v3.json

clm_instruct_v3:
  - size: 230m
    stage: Instruct
    local_artifact: models/lfm25-230m-wolof-instruct-ortho-ns-mixed-merged
    hub_repo: Tonic/LFM2.5-230M-Wolof-Instruct-v3
    sft_eval: results/full_pipeline/eval_ortho_ns_mixed/230m/evaluation.json
    clm_metrics: metrics/clm/lfm_230m_instruct_v3.json
  - size: 350m
    stage: Instruct
    local_artifact: models/lfm25-350m-wolof-instruct-ortho-ns-mixed-merged
    hub_repo: Tonic/LFM2.5-350M-Wolof-Instruct-v3
    sft_eval: results/full_pipeline/eval_ortho_ns_mixed/350m/evaluation.json
    clm_metrics: metrics/clm/lfm_350m_instruct_v3.json
  - size: 1.2b
    stage: Instruct
    local_artifact: models/lfm25-1.2b-wolof-instruct-ortho-ns-mixed-merged
    hub_repo: Tonic/LFM2.5-1.2B-Wolof-Instruct-v3
    sft_eval: results/full_pipeline/eval_ortho_ns_mixed/1.2b/evaluation.json
    clm_metrics: metrics/clm/lfm_1.2b_instruct_v3.json
  - size: 2.6b
    stage: Instruct
    local_artifact: models/lfm25-2.6b-wolof-instruct-ortho-ns-mixed-merged
    hub_repo: Tonic/LFM2.5-2.6B-Wolof-Instruct-v3
    sft_eval: results/full_pipeline/eval_ortho_ns_mixed/2.6b/evaluation.json
    clm_metrics: metrics/clm/lfm_2.6b_instruct_v3.json
  - size: 8b-a1b
    stage: Instruct
    local_artifact: models/lfm25-8b-a1b-wolof-instruct-ortho-ns-mixed-merged
    hub_repo: Tonic/LFM2.5-8B-A1B-Wolof-Instruct-v3
    sft_eval: results/full_pipeline/eval_ortho_ns_mixed/8b-a1b/evaluation.json
    clm_metrics: metrics/clm/lfm_8b_instruct_v3.json

