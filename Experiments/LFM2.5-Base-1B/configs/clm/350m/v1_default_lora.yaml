# v1 equal-data — 350M default tokenizer LoRA (thin expand of smoke)

run: v1_350m_default_lora
stage: v1
size: 350m
base_id: LiquidAI/LFM2.5-350M-Base
tokenizer: null
model: null
output_root: runs/clm/350m/v1_default_lora
data_root: null
methode: lora
attention: sdpa
tokenizer_family: 65k

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: null

entrainement:
  max_steps: 1500
  seq_len: 2048
  micro_bs: 2
  grad_acc: 8
  lr: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  logging_steps: 25
  eval_steps: 100
  save_steps: 500
  save_total_limit: 3
  gradient_checkpointing: true
  optim: adamw_torch
  seed: 42
