run: qwen35_08b_cpt_v1
stage: v1
size: 08b
base_id: Qwen/Qwen3.5-0.8B-Base
tokenizer: tokenizers/qwen35-wolof-ext-anchors
model: models/qwen35-0.8b-ext-init
data_root: data/ortho_ns_mixed_v1/cpt
methode: lora
extended_tokenizer: true
output_root: runs/clm/08b/v1_ntp70_ortho_lora
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: [embed_tokens, lm_head]
entrainement:
  num_train_epochs: 3
  seq_len: 2048
  # H200 ~144GB; was micro_bs=1+ckpt (~65GB used, ~8s/step). Same eff. batch=16.
  micro_bs: 8
  grad_acc: 2
  eval_micro_bs: 16
  max_eval_samples: 512
  lr: 2.0e-4
  eval_steps: 200
  save_steps: 200
  logging_steps: 20
  gradient_checkpointing: false
  seed: 42
  save_total_limit: 3
  best_pool_keep: 15
  patience: 5
