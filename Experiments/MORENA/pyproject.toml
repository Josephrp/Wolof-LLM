[project]
name = "galsenai-morena-wolof"
version = "0.1.0"
description = "MORENA Wolof continuum (native Muon/FSDP2 trainer)"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy",
  "safetensors",
  "tokenizers",
  "huggingface_hub",
  "pyyaml",
  "pandas",
  "tqdm",
  "sacrebleu",
  "trackio",
]

[project.optional-dependencies]
train = [
  "flash-attn>=2.5; platform_system=='Linux'",
]
