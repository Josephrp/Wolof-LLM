dpo_std:
  - role: dpo
    local_artifact: models/tinyaya-3.35b-dpo-std-v1-merged
    hub_repo: Tonic/TinyAya-3.35B-Wolof-DPO-std-v1
    stage: DPO
    base_model: Tonic/TinyAya-3.35B-Wolof-InstructEarth-std-v1
    clm_metrics: results/bpb/dpo_std_3b35.json
    sft_eval: results/sft/eval_3b35_std_dpo/evaluation.json
