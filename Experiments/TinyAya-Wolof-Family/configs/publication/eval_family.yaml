  cpt_test_std: data/ortho_std_mixed_v1/cpt/test_ortho_kept.parquet
  sft_val_ns: data/sft/prepared_anchored_v1/val.parquet
  sft_val_std: data/sft/prepared_anchored_std_v1/val.parquet

metrics_out: docs/FAMILY_EVAL.md
