  - role: from_earth
    local_artifact: models/tinyaya-3.35b-instruct-from-earth-std-merged
    hub_repo: Tonic/TinyAya-3.35B-Wolof-InstructEarth-std-v1
    stage: InstructEarth
    base_model: CohereLabs/tiny-aya-earth
    clm_metrics: results/bpb/instruct_from_earth_std_3b35.json
    sft_eval: results/sft/eval_3b35_std_from_earth/evaluation.json
