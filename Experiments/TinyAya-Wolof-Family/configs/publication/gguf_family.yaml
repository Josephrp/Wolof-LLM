    gguf_repo_name: TinyAya-3.35B-Wolof-CPT-std-v1-GGUF
    file_stem: TinyAya-3.35B-Wolof-CPT-std-v1
    clm_metrics: results/bpb/clm_cpt_std_3b35.json

  - size: 3b35
