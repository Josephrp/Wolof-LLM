run: wolof-default-full
base_id: HuggingFaceTB/SmolLM3-3B-Base
tokenizer: HuggingFaceTB/SmolLM3-3B-Base
model: HuggingFaceTB/SmolLM3-3B-Base
output_root: /mnt/volume_w2l8nkp/galsenllm/OutputOfSmolLM_Model
data_root: /mnt/volume_w2l8nkp/galsenllm/data
methode: full
# --- materiel ---
attention: sdpa

entrainement:
  max_steps: 2234            
  seq_len: 2048             
  micro_bs: 4
  grad_acc: 8              
  lr: 2.0e-5
  scheduler: cosine
  warmup_ratio: 0.03
  logging_steps: 25
  eval_steps: 100            
  save_steps: 500            
  save_total_limit: 3
  gradient_checkpointing: true
  optim: adamw_torch
  seed: 42
